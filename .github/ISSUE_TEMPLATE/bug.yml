name: Something does not work
description: Verfy did something wrong, or did not do what the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks. Leave out keys, tokens and private paths: a receipt or a config can hold them. A way around Verfy's checks goes to the security policy instead."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The commands you ran, and the agent you used (Claude Code, Codex CLI, Gemini CLI, Cursor, Copilot, Devin).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `verfy doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: verfy --version and your system
      placeholder: verfy 0.23.0, Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
