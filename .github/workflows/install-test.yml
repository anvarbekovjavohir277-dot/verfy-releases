name: Test the one-line installers

# Runs the live install scripts from the website on clean machines, the way a user would.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build standalone verfy"]
    types: [completed]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  unix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Install
        run: curl -fsSL https://verfy-tech.vercel.app/install.sh | sh
      - name: Use it from a new shell
        shell: bash -l {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          verfy --version
          verfy check "npm test"
          set +e; verfy check "rm -rf ~"; code=$?; set -e
          test "$code" -eq 2

  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Install
        shell: powershell
        run: irm https://verfy-tech.vercel.app/install.ps1 | iex
      - name: Use it from a new shell
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          verfy --version
          verfy check "npm test"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          verfy check "rm -rf ~"
          if ($LASTEXITCODE -ne 2) { exit 1 }
          exit 0

  action:
    # the public GitHub Action, used from another repository the way the docs show it
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A repository with a locked MCP config
        run: |
          base=https://raw.githubusercontent.com/anvarbekovjavohir277-dot/verfy/main/verfy-cli/examples/ci
          curl -fsSL -o .mcp.json "$base/mcp.json"
          curl -fsSL -o verfy.lock "$base/verfy.lock"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: anvarbekovjavohir277-dot/verfy@cli-v0.3.0
        with:
          config: .mcp.json
          lock: verfy.lock
