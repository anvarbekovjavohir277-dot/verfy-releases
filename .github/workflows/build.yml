name: Build standalone verfy

# Builds verfy from its PyPI release into a folder that carries its own Python,
# for each platform, and publishes them as a GitHub release with SHA256SUMS.
# Runs on demand and every 6 hours; it only builds a version that has no release yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "verfy version on PyPI (empty: the latest)"
        required: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${WANT:-$(curl -fsS https://pypi.org/pypi/verfy/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')}"
          echo "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)' || { echo "::error::bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "build=false"; else echo "build=true"; fi >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, ext: zip }
          - { os: ubuntu-22.04, target: linux-x64, ext: tar.gz }
          - { os: ubuntu-22.04-arm, target: linux-arm64, ext: tar.gz }
          - { os: macos-latest, target: macos-arm64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 "verfy==$VERSION"
          python -m PyInstaller --noconfirm --clean --onedir --name verfy --collect-data verfy entry.py
      - name: Test the build
        run: |
          v=dist/verfy/verfy; [ -f "$v.exe" ] && v="$v.exe"
          got=$("$v" --version | tr -d '\r')
          echo "$got"
          test "$got" = "verfy $VERSION"
          "$v" check "npm test"
          set +e; "$v" check "rm -rf ~"; code=$?; set -e
          test "$code" -eq 2
          VERFY_HOME="$RUNNER_TEMP/home" "$v" demo | grep -q "chain verified"
      - name: Package
        run: |
          name="verfy-${{ matrix.target }}.${{ matrix.ext }}"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then 7z a -tzip "../$name" verfy >/dev/null; else tar -czf "../$name" verfy; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: verfy-${{ matrix.target }}.${{ matrix.ext }}

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: |
          cd out
          sha256sum verfy-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "v$VERSION" * --repo "$GITHUB_REPOSITORY" --title "verfy $VERSION" --notes \
            "Standalone builds of [verfy $VERSION](https://pypi.org/project/verfy/$VERSION/) from PyPI, with Python included. Built and tested by this repository's workflow. Install: https://verfy-tech.vercel.app/docs#install"
